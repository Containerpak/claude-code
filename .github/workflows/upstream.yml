name: Follow upstream

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  follow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read the published release
        id: upstream
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://registry.npmjs.org/@anthropic-ai%2fclaude-code/latest | jq -r '.version')"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::upstream answered something that is not a version"; exit 1 ;;
          esac
          for pair in amd64:linux-x64 arm64:linux-arm64; do
            architecture="${pair%%:*}"
            platform="${pair#*:}"
            metadata="$(curl -fsSL "https://registry.npmjs.org/@anthropic-ai%2fclaude-code-${platform}/${version}")"
            url="$(printf '%s' "$metadata" | jq -r '.dist.tarball')"
            curl -fsSL "$url" -o "${architecture}.tgz"
            {
              echo "${architecture}_url=$url"
              echo "${architecture}_sha256=$(sha256sum "${architecture}.tgz" | cut -d ' ' -f 1)"
              echo "${architecture}_size=$(stat -c %s "${architecture}.tgz")"
            } >> "$GITHUB_OUTPUT"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Move the pin
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          AMD64_URL: ${{ steps.upstream.outputs.amd64_url }}
          AMD64_SHA256: ${{ steps.upstream.outputs.amd64_sha256 }}
          AMD64_SIZE: ${{ steps.upstream.outputs.amd64_size }}
          ARM64_URL: ${{ steps.upstream.outputs.arm64_url }}
          ARM64_SHA256: ${{ steps.upstream.outputs.arm64_sha256 }}
          ARM64_SIZE: ${{ steps.upstream.outputs.arm64_size }}
        run: |
          set -euo pipefail
          current="$(jq -r '.version' cpak.json)"
          if [ "$current" = "$VERSION" ]; then
            echo "already at $VERSION"
            exit 0
          fi
          jq \
            --arg version "$VERSION" \
            --arg amd64_url "$AMD64_URL" \
            --arg amd64_sha256 "$AMD64_SHA256" \
            --argjson amd64_size "$AMD64_SIZE" \
            --arg arm64_url "$ARM64_URL" \
            --arg arm64_sha256 "$ARM64_SHA256" \
            --argjson arm64_size "$ARM64_SIZE" \
            '.version = $version |
             .runtime_sources |= map(
               if .architecture == "amd64" then
                 .name = ("claude-code-linux-x64-" + $version + ".tgz") |
                 .url = $amd64_url |
                 .sha256 = $amd64_sha256 |
                 .size = $amd64_size
               elif .architecture == "arm64" then
                 .name = ("claude-code-linux-arm64-" + $version + ".tgz") |
                 .url = $arm64_url |
                 .sha256 = $arm64_sha256 |
                 .size = $arm64_size
               else .
               end
             )' cpak.json > cpak.json.next
          mv cpak.json.next cpak.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cpak.json
          git commit -m "chore: follow upstream ${VERSION}"
          git push
